name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk GlassLauncher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GlassLauncher-apk
          path: GlassLauncher.apk

      # Publishes the APK so it can be downloaded with a direct link:
      # https://github.com/<owner>/<repo>/releases/latest/download/GlassLauncher.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Glass Launcher build ${{ github.run_number }}
          files: GlassLauncher.apk
          make_latest: true
