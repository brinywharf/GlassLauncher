name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: 0.7.0-alpha

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk GlassLauncher-alpha.apk

      # Turn compiler errors into a visible annotation on the run page
      - name: Report build errors
        if: failure()
        run: |
          msg=$(grep -E "^e: |What went wrong|error:|Could not resolve|> " build.log | grep -v "^> Task" | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build failed::${msg}"

      # Private-repo friendly: put the APK (or the build log) on a "builds" branch,
      # so it can be fetched with plain git.
      - name: Publish to builds branch
        if: always()
        run: |
          mkdir -p out
          cp GlassLauncher-alpha.apk out/ 2>/dev/null || true
          cp build.log out/ 2>/dev/null || true
          echo "${{ job.status }}" > out/status.txt
          cd out
          git init -q -b builds
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "build ${{ github.run_number }} ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" builds

      - uses: actions/upload-artifact@v4
        with:
          name: GlassLauncher-alpha
          path: GlassLauncher-alpha.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-build${{ github.run_number }}
          name: Glass Launcher ${{ env.VERSION }} (build ${{ github.run_number }}) · ALPHA
          files: GlassLauncher-alpha.apk
          make_latest: true
          body: |
            ⚠️ **ALPHA**: Glass Launcher is still in development. Expect bugs, missing features and changes between builds.

            **Install:** download `GlassLauncher-alpha.apk` on your Android 13+ device, open it, and allow installing from that app if asked.
            Then press Home and pick **Glass Launcher Alpha**.

            Built from commit ${{ github.sha }}.
